spring.application.name=atlas
amadeus.api.key=${AMADEUS_API_KEY}
amadeus.api.secret=${AMADEUS_API_SECRET}
amadeus.api.url=https://test.api.amadeus.com

spring.http.converters.preferred-json-mapper=gson

#spring.datasource.url=jdbc:postgresql://localhost:5432/atlas
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Supabase's pooler (port 6543) runs PgBouncer in transaction mode, which does not support
# server-side prepared statements: the driver must not create them (Flyway failed with
# 'prepared statement "S_n" does not exist', Hibernate could fail intermittently).
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# The schema is owned by Flyway (src/main/resources/db/migration), not by Hibernate.
# Tests run with ddl-auto=validate to prove that migrations and entities match.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=OTHER


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.frontend-url=${FRONTEND_URL:https://atlas-works.vercel.app/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://atlas-works.vercel.app,http://localhost:5173}

supabase.url=https://egihhtxmuuwvwwwpxbkj.supabase.co
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=avatars

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# Python AI microservice (atlas-ai_service)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:}
ai.service.timeout=90s

server.port=${PORT:8080}

# OpenAPI / Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

# Rate limiting on the public AI endpoints
app.rate-limit.ai.enabled=true
app.rate-limit.ai.per-minute=5
app.rate-limit.ai.per-hour=30

# Grounding with real Amadeus activities
ai.grounding.enabled=true
ai.grounding.max-activities=10
ai.grounding.timeout=4s

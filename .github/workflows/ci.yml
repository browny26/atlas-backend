name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, controller/security tests (MockMvc) and the full application
      # on PostgreSQL via Testcontainers (Flyway migrations + Hibernate validation).
      - name: Build and test
        run: ./mvnw -B verify
      - name: Docker image
        run: docker build -t atlas-backend .

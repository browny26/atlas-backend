# Whole Atlas platform locally, with one command.
#
#   git clone https://github.com/browny26/atlas-backend.git
#   git clone https://github.com/browny26/atlas-ai_service.git
#   git clone https://github.com/browny26/atlas-frontend.git
#   cd atlas-backend && cp .env.example .env   # add your keys
#   docker compose up --build
#
# Frontend http://localhost:5173 · API http://localhost:8080/swagger-ui.html
# AI service http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      retries: 10

  ai-service:
    build: ../atlas-ai_service
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-local-dev-key}
    ports:
      - "8000:8000"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/atlas
      DB_USERNAME: atlas
      DB_PASSWORD: atlas
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-local-dev-key}
      FRONTEND_URL: http://localhost:5173/
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../atlas-frontend
      args:
        VITE_BE_URL: http://localhost:8080
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
